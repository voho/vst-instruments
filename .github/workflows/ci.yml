name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP tests (${{ matrix.name }}, JUCE-free, Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vocalor
            directory: vocalor
            build_plugin_option: VOCALOR_BUILD_PLUGIN
          - name: Drumalor
            directory: drumalor
            build_plugin_option: DRUMALOR_BUILD_PLUGIN
          - name: Mars
            directory: mars
            build_plugin_option: MARS_BUILD_PLUGIN
          - name: Neuramar
            directory: neuramar
            build_plugin_option: NEURAMAR_BUILD_PLUGIN
          - name: Electry
            directory: electry
            build_plugin_option: ELECTRY_BUILD_PLUGIN
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake \
            -S "${{ matrix.directory }}" \
            -B "${{ matrix.directory }}/build-dsp" \
            -DCMAKE_BUILD_TYPE=Release \
            "-D${{ matrix.build_plugin_option }}=OFF" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build "${{ matrix.directory }}/build-dsp" --parallel

      - name: Test
        run: ctest --test-dir "${{ matrix.directory }}/build-dsp" --output-on-failure

  plugin-macos:
    name: Plug-in build (${{ matrix.name }}, macOS native arch)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vocalor
            directory: vocalor
          - name: Drumalor
            directory: drumalor
          - name: Mars
            directory: mars
          - name: Neuramar
            directory: neuramar
          - name: Electry
            directory: electry
    steps:
      - uses: actions/checkout@v4

      # Native-arch only keeps per-push CI fast; the nightly workflow builds
      # the full arm64 + x86_64 universal binaries. Uses the same Xcode-based
      # build script developers run locally, and runs each project's tests.
      - name: Build plug-in and run tests
        working-directory: ${{ matrix.directory }}
        env:
          BUILD_UNIVERSAL: "OFF"
        run: ./scripts/build-macos.sh
