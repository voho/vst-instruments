name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP tests (${{ matrix.name }}, JUCE-free, Linux)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vocalor
            directory: vocalor
            build_plugin_option: VOCALOR_BUILD_PLUGIN
            target_demo: VocalorRenderDemos
            expected_demos: 10
          - name: Drumalor
            directory: drumalor
            build_plugin_option: DRUMALOR_BUILD_PLUGIN
            target_demo: DrumalorRenderDemos
            expected_demos: 7
          - name: Neuramar
            directory: neuramar
            build_plugin_option: NEURAMAR_BUILD_PLUGIN
            target_demo: NeuramarRenderDemos
            expected_demos: 8
          - name: Electry
            directory: electry
            build_plugin_option: ELECTRY_BUILD_PLUGIN
            target_demo: ElectryRenderDemos
            expected_demos: 14
          - name: Taikor
            directory: taikor
            build_plugin_option: TAIKOR_BUILD_PLUGIN
            target_demo: TaikorRenderDemos
            expected_demos: 27
          - name: YouKnow106
            directory: youknow106
            build_plugin_option: YOUKNOW106_BUILD_PLUGIN
            target_demo: YouKnow106RenderDemos
            expected_demos: 10
          - name: YouKnow201
            directory: youknow201
            build_plugin_option: YOUKNOW201_BUILD_PLUGIN
            target_demo: YouKnow201RenderDemos
            expected_demos: 10
          # Ghost is in its DSP-first phase: the engine, tests and demo
          # renderer exist before any JUCE wrapper does, so its lane skips
          # the plug-in steps until the wrapper lands.
          - name: Ghost
            directory: ghost
            build_plugin_option: GHOST_BUILD_PLUGIN
            target_demo: GhostRenderDemos
            expected_demos: 10
            dsp_only: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          cmake \
            -S "${{ matrix.directory }}" \
            -B "${{ matrix.directory }}/build-dsp" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-D${{ matrix.build_plugin_option }}=OFF" \
            -DBUILD_TESTING=ON

      - name: Build and test DSP engine
        run: |
          cmake --build "${{ matrix.directory }}/build-dsp" --parallel
          ctest --test-dir "${{ matrix.directory }}/build-dsp" --output-on-failure

      - name: Render and verify demo audio
        run: |
          set -euo pipefail
          cmake --build "${{ matrix.directory }}/build-dsp" --target "${{ matrix.target_demo }}" --parallel
          "./${{ matrix.directory }}/build-dsp/${{ matrix.target_demo }}" "${{ matrix.directory }}/Docs/audio"
          rendered=$(find "${{ matrix.directory }}/Docs/audio" -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != ${{ matrix.expected_demos }} )); then
            echo "error: rendered $rendered demo WAVs, expected ${{ matrix.expected_demos }}" >&2
            exit 1
          fi
          echo "${{ matrix.name }}: rendered all $rendered demo WAVs"

      - name: Configure Linux plug-in build
        if: matrix.dsp_only != true
        run: |
          cmake \
            -S "${{ matrix.directory }}" \
            -B "${{ matrix.directory }}/build-dsp" \
            -DCMAKE_BUILD_TYPE=Release \
            "-D${{ matrix.build_plugin_option }}=ON" \
            -DBUILD_TESTING=OFF

      - name: Build Linux VST3 and standalone
        if: matrix.dsp_only != true
        run: |
          cmake --build "${{ matrix.directory }}/build-dsp" --parallel \
            --target "${{ matrix.name }}_VST3" "${{ matrix.name }}_Standalone"

      - name: Package Linux VST3 and standalone
        if: matrix.dsp_only != true
        run: |
          set -euo pipefail
          artefacts="${{ matrix.directory }}/build-dsp/${{ matrix.name }}_artefacts/Release"
          test -d "$artefacts/VST3/${{ matrix.name }}.vst3"
          test -x "$artefacts/Standalone/${{ matrix.name }}"
          dist="${{ matrix.directory }}/build-dsp/dist"
          mkdir -p "$dist"
          archive="$dist/${{ matrix.name }}-Linux-x64.tar.gz"
          tar -czf "$archive" -C "$artefacts" \
            "VST3/${{ matrix.name }}.vst3" \
            "Standalone/${{ matrix.name }}"
          test -s "$archive"
          tar -tzf "$archive" >/dev/null

      - name: Upload Linux package
        if: matrix.dsp_only != true
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-${{ matrix.directory }}
          path: ${{ matrix.directory }}/build-dsp/dist/${{ matrix.name }}-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  plugin-macos:
    name: Plug-in build (${{ matrix.name }}, macOS native arch)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vocalor
            directory: vocalor
            snapshot_variable: VOCALOR_EDITOR_SNAPSHOT
          - name: Drumalor
            directory: drumalor
            snapshot_variable: DRUMALOR_EDITOR_SNAPSHOT
          - name: Neuramar
            directory: neuramar
            snapshot_variable: NEURAMAR_EDITOR_SNAPSHOT
          - name: Electry
            directory: electry
            snapshot_variable: ELECTRY_EDITOR_SNAPSHOT
          - name: Taikor
            directory: taikor
            snapshot_variable: TAIKOR_EDITOR_SNAPSHOT
          - name: YouKnow106
            directory: youknow106
            snapshot_variable: YOUKNOW106_EDITOR_SNAPSHOT
          - name: YouKnow201
            directory: youknow201
            snapshot_variable: YOUKNOW201_EDITOR_SNAPSHOT
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Clear any committed screenshot before rendering to ensure this build produces it
      - name: Clear screenshot before rendering
        run: rm -f "${{ matrix.directory }}/Docs/screenshots/${{ matrix.directory }}-standalone.png"

      # Native-arch only keeps per-push CI fast; the nightly workflow builds
      # the full arm64 + x86_64 universal binaries. Uses the same Xcode-based
      # build script developers run locally, and runs each project's tests.
      - name: Build plug-in and run tests
        working-directory: ${{ matrix.directory }}
        env:
          BUILD_UNIVERSAL: "OFF"
          ${{ matrix.snapshot_variable }}: "${{ github.workspace }}/${{ matrix.directory }}/Docs/screenshots/${{ matrix.directory }}-standalone.png"
        run: ./scripts/build-macos.sh

      - name: Check that the editor screenshot was rendered
        run: |
          set -euo pipefail
          screenshot="${{ matrix.directory }}/Docs/screenshots/${{ matrix.directory }}-standalone.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "error: ${{ matrix.name }}'s suite did not render $screenshot" >&2
            echo "The suite must honour ${{ matrix.snapshot_variable }}." >&2
            exit 1
          fi
          if [[ "$(head -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
            echo "error: $screenshot does not carry the PNG signature" >&2
            exit 1
          fi
          if [[ "$(tail -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "49454e44ae426082" ]]; then
            echo "error: $screenshot has no terminating IEND chunk, so the write did not finish" >&2
            exit 1
          fi
          echo "Rendered $screenshot ($(wc -c < "$screenshot") bytes)."

  dsp-tests-windows:
    name: DSP tests (${{ matrix.name }}, JUCE-free, Windows)
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vocalor
            directory: vocalor
            build_plugin_option: VOCALOR_BUILD_PLUGIN
          - name: Drumalor
            directory: drumalor
            build_plugin_option: DRUMALOR_BUILD_PLUGIN
          - name: Neuramar
            directory: neuramar
            build_plugin_option: NEURAMAR_BUILD_PLUGIN
          - name: Electry
            directory: electry
            build_plugin_option: ELECTRY_BUILD_PLUGIN
          - name: Taikor
            directory: taikor
            build_plugin_option: TAIKOR_BUILD_PLUGIN
          - name: YouKnow106
            directory: youknow106
            build_plugin_option: YOUKNOW106_BUILD_PLUGIN
          - name: YouKnow201
            directory: youknow201
            build_plugin_option: YOUKNOW201_BUILD_PLUGIN
          # DSP-first phase: no plug-in steps until the wrapper lands.
          - name: Ghost
            directory: ghost
            build_plugin_option: GHOST_BUILD_PLUGIN
            dsp_only: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure DSP tests
        run: |
          cmake -S "${{ matrix.directory }}" -B "${{ matrix.directory }}/build-win" -A x64 "-D${{ matrix.build_plugin_option }}=OFF" -DBUILD_TESTING=ON "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build and test DSP engine
        run: |
          cmake --build "${{ matrix.directory }}/build-win" --config Release --parallel
          ctest --test-dir "${{ matrix.directory }}/build-win" -C Release --output-on-failure

      - name: Configure Windows plug-in build
        if: matrix.dsp_only != true
        run: |
          cmake -S "${{ matrix.directory }}" -B "${{ matrix.directory }}/build-win" "-D${{ matrix.build_plugin_option }}=ON" -DBUILD_TESTING=OFF

      - name: Build Windows VST3 and standalone
        if: matrix.dsp_only != true
        run: |
          cmake --build "${{ matrix.directory }}/build-win" --config Release --parallel --target "${{ matrix.name }}_VST3" "${{ matrix.name }}_Standalone"

      - name: Package Windows VST3 and standalone
        if: matrix.dsp_only != true
        shell: pwsh
        run: |
          $artefacts = "${{ matrix.directory }}/build-win/${{ matrix.name }}_artefacts/Release"
          $vst3 = Join-Path $artefacts "VST3/${{ matrix.name }}.vst3"
          $standalone = Join-Path $artefacts "Standalone/${{ matrix.name }}.exe"
          if (-not (Test-Path -LiteralPath $vst3 -PathType Container)) {
            throw "expected VST3 bundle at $vst3"
          }
          if (-not (Test-Path -LiteralPath $standalone -PathType Leaf)) {
            throw "expected standalone executable at $standalone"
          }
          $dist = "${{ matrix.directory }}/build-win/dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $zip = Join-Path $dist "${{ matrix.name }}-Windows-x64.zip"
          Compress-Archive -LiteralPath (Join-Path $artefacts "VST3"), (Join-Path $artefacts "Standalone") -DestinationPath $zip
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf) -or
              (Get-Item -LiteralPath $zip).Length -eq 0) {
            throw "expected package at $zip"
          }

      - name: Upload Windows package
        if: matrix.dsp_only != true
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-${{ matrix.directory }}
          path: ${{ matrix.directory }}/build-win/dist/${{ matrix.name }}-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
