name: Nightly

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: # allow manual runs from the Actions tab

# Refresh the rolling "nightly" release so the latest build is always available.
permissions:
  contents: write

# Never interrupt an in-progress publish; just don't run two at once.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # The committed Electry demonstration WAVs are rendered by the JUCE-free
  # renderer, so any model change shows up as changed bytes. Re-rendering and
  # committing them nightly keeps the audible record in lockstep with the
  # code; the nightly Linux toolchain is the canonical renderer, and a run on
  # an unchanged model commits nothing because the render is deterministic.
  refresh-audio-demos:
    if: github.ref == 'refs/heads/main'
    name: Re-render committed Electry demo audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build must not inherit the write credential; the push step
          # below supplies the token explicitly instead.
          persist-credentials: false

      - name: Build the JUCE-free demo renderer
        run: |
          cmake -S electry -B electry/build-dsp -DCMAKE_BUILD_TYPE=Release \
            -DELECTRY_BUILD_PLUGIN=OFF -DBUILD_TESTING=OFF
          cmake --build electry/build-dsp --parallel \
            --target ElectryRenderDemos

      - name: Render and commit the demo audio if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./electry/build-dsp/ElectryRenderDemos electry/Docs/audio
          if git diff --quiet -- electry/Docs/audio; then
            echo "Demo audio is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electry/Docs/audio
          git commit -m "Nightly: re-render the committed Electry demo audio"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main

  build-macos:
    if: github.ref == 'refs/heads/main'
    name: Universal builds, packages, and rolling release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build-time FetchContent code must not inherit the write credential.
          persist-credentials: false

      # Full arm64 + x86_64 universal builds (script default) plus project
      # tests. Each suite that supports it renders its committed editor
      # screenshot while it runs, so the images in the READMEs track the real
      # editors; the commit step below pushes any that changed.
      - name: Build Vocalor and run tests
        working-directory: vocalor
        run: ./scripts/build-macos.sh

      - name: Package Vocalor (ad-hoc-signed bundles)
        working-directory: vocalor
        run: ./scripts/sign-and-package-macos.sh

      - name: Build Drumalor and run tests
        working-directory: drumalor
        env:
          DRUMALOR_EDITOR_SNAPSHOT: ${{ github.workspace }}/drumalor/Docs/screenshots/drumalor-standalone.png
        run: ./scripts/build-macos.sh

      - name: Package Drumalor (ad-hoc-signed bundles)
        working-directory: drumalor
        run: ./scripts/sign-and-package-macos.sh

      - name: Build Mars and run tests
        working-directory: mars
        env:
          MARS_EDITOR_SNAPSHOT: ${{ github.workspace }}/mars/Docs/screenshots/mars-standalone.png
        run: ./scripts/build-macos.sh

      - name: Package Mars (ad-hoc-signed bundles)
        working-directory: mars
        run: ./scripts/sign-and-package-macos.sh

      - name: Build Neuramar and run tests
        working-directory: neuramar
        env:
          NEURAMAR_EDITOR_SNAPSHOT: ${{ github.workspace }}/neuramar/Docs/screenshots/neuramar-standalone.png
        run: ./scripts/build-macos.sh

      - name: Package Neuramar (ad-hoc-signed bundles)
        working-directory: neuramar
        run: ./scripts/sign-and-package-macos.sh

      - name: Build Electry and run tests
        working-directory: electry
        env:
          ELECTRY_EDITOR_SNAPSHOT: ${{ github.workspace }}/electry/Docs/screenshots/electry-standalone.png
        run: ./scripts/build-macos.sh

      - name: Package Electry (ad-hoc-signed bundles)
        working-directory: electry
        run: ./scripts/sign-and-package-macos.sh

      # Vocalor's suite has no snapshot hook yet, so its screenshot is not
      # regenerated here. The rebase-and-retry loop absorbs the audio-demos
      # job (or anything else) having pushed to main while this job built.
      - name: Commit regenerated screenshots if they changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths=(
            drumalor/Docs/screenshots
            mars/Docs/screenshots
            neuramar/Docs/screenshots
            electry/Docs/screenshots
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Screenshots are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Nightly: regenerate the committed editor screenshots"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git pull --rebase "$REMOTE" main
            if git push "$REMOTE" HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "error: could not push the regenerated screenshots" >&2
          exit 1

      # Retained on the workflow run itself (downloadable by anyone with repo
      # access). Instrument-specific patterns prevent one output from
      # accidentally satisfying the other instrument's artifact check.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vst-instruments-nightly-macOS-universal
          path: |
            vocalor/build-macos/dist/Vocalor-*-macOS-universal.zip
            vocalor/build-macos/dist/Vocalor-*-macOS-universal.pkg
            drumalor/build-macos/dist/Drumalor-*-macOS-universal.zip
            drumalor/build-macos/dist/Drumalor-*-macOS-universal.pkg
            mars/build-macos/dist/Mars-*-macOS-universal.zip
            mars/build-macos/dist/Mars-*-macOS-universal.pkg
            neuramar/build-macos/dist/Neuramar-*-macOS-universal.zip
            neuramar/build-macos/dist/Neuramar-*-macOS-universal.pkg
            electry/build-macos/dist/Electry-*-macOS-universal.zip
            electry/build-macos/dist/Electry-*-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 14

      # Publish a single rolling "nightly" release so all five instruments share a
      # stable public download URL.
      - name: Publish rolling "nightly" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          assets=(
            vocalor/build-macos/dist/Vocalor-*-macOS-universal.zip
            vocalor/build-macos/dist/Vocalor-*-macOS-universal.pkg
            drumalor/build-macos/dist/Drumalor-*-macOS-universal.zip
            drumalor/build-macos/dist/Drumalor-*-macOS-universal.pkg
            mars/build-macos/dist/Mars-*-macOS-universal.zip
            mars/build-macos/dist/Mars-*-macOS-universal.pkg
            neuramar/build-macos/dist/Neuramar-*-macOS-universal.zip
            neuramar/build-macos/dist/Neuramar-*-macOS-universal.pkg
            electry/build-macos/dist/Electry-*-macOS-universal.zip
            electry/build-macos/dist/Electry-*-macOS-universal.pkg
          )
          if (( ${#assets[@]} != 10 )); then
            echo "error: expected exactly ten release assets, found ${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "error: missing release asset: $asset" >&2
              exit 1
            fi
          done

          # Unique names let the previous complete release remain downloadable
          # throughout this upload. A rerun for the same commit may safely
          # replace only that commit's staged files.
          STAGING_DIR="${RUNNER_TEMP}/nightly-release-assets"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          staged_assets=()
          for asset in "${assets[@]}"; do
            filename="${asset##*/}"
            stem="${filename%.*}"
            extension="${filename##*.}"
            staged="${STAGING_DIR}/${stem}-g${SHORT_SHA}.${extension}"
            cp -p "$asset" "$staged"
            staged_assets+=("$staged")
          done
          expected_asset_names=()
          for asset in "${staged_assets[@]}"; do
            expected_asset_names+=("${asset##*/}")
          done

          TITLE="VST instruments nightly ($DATE)"
          NOTES="Automated universal (arm64 + x86_64) macOS builds of Vocalor, Drumalor, Mars, Neuramar, and Electry from \`main\` ($SHORT_SHA).

          **These bundles are ad-hoc signed and not notarized**, so Gatekeeper will warn. To run a nightly locally, clear the quarantine flag after unzipping, e.g.:

          \`\`\`bash
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Vocalor.vst3 Library/Audio/Plug-Ins/Components/Vocalor.component Applications/Vocalor.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Drumalor.vst3 Library/Audio/Plug-Ins/Components/Drumalor.component Applications/Drumalor.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Mars.vst3 Library/Audio/Plug-Ins/Components/Mars.component Applications/Mars.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Neuramar.vst3 Library/Audio/Plug-Ins/Components/Neuramar.component Applications/Neuramar.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Electry.vst3 Library/Audio/Plug-Ins/Components/Electry.component Applications/Electry.app
          \`\`\`

          Not intended for production distribution."

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${staged_assets[@]}" --clobber

            published_asset_names=()
            while IFS= read -r asset_name; do
              published_asset_names+=("$asset_name")
            done < <(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              --jq '.assets[] | select(.size > 0) | .name')
            for expected_name in "${expected_asset_names[@]}"; do
              found=0
              for published_name in "${published_asset_names[@]}"; do
                if [[ "$published_name" == "$expected_name" ]]; then
                  found=1
                  break
                fi
              done
              if (( found == 0 )); then
                echo "error: uploaded release asset was not verified: $expected_name" >&2
                exit 1
              fi
            done

            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit nightly --title "$TITLE" --prerelease --notes "$NOTES"

            # Prune only after upload verification and metadata/tag switching.
            # If pruning itself fails, both complete generations remain usable.
            while IFS=$'\t' read -r asset_id asset_name; do
              is_expected=0
              for expected_name in "${expected_asset_names[@]}"; do
                if [[ "$asset_name" == "$expected_name" ]]; then
                  is_expected=1
                  break
                fi
              done
              if (( is_expected == 0 )); then
                echo "Removing stale nightly asset: $asset_name"
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
              fi
            done < <(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              --jq '.assets[] | [.id, .name] | @tsv')
          else
            gh release create nightly "${staged_assets[@]}" \
              --title "$TITLE" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --notes "$NOTES"
          fi
