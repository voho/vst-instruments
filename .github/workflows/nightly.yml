name: Nightly

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: # allow manual runs from the Actions tab

# Refresh the rolling "nightly" release so the latest build is always available.
permissions:
  contents: write

# Never interrupt an in-progress publish; just don't run two at once.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # The committed demonstration WAVs of every instrument are rendered by their
  # JUCE-free renderers, so any model change shows up as changed bytes.
  # Re-rendering and committing them nightly keeps the audible record in
  # lockstep with the code; the nightly Linux toolchain is the canonical
  # renderer, and a run on an unchanged model commits nothing because every
  # render is deterministic.
  refresh-audio-demos:
    if: github.ref == 'refs/heads/main'
    name: Re-render the committed demo audio of every instrument
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build must not inherit the write credential; the push step
          # below supplies the token explicitly instead.
          persist-credentials: false

      - name: Build the JUCE-free demo renderers
        run: |
          for instrument in vocalor drumalor neuramar electry taikor youknow106; do
            upper=$(echo "$instrument" | tr '[:lower:]' '[:upper:]')
            case "$instrument" in
              vocalor)    target=VocalorRenderDemos ;;
              drumalor)   target=DrumalorRenderDemos ;;
              neuramar)   target=NeuramarRenderDemos ;;
              electry)    target=ElectryRenderDemos ;;
              taikor)     target=TaikorRenderDemos ;;
              youknow106) target=YouKnow106RenderDemos ;;
            esac
            cmake -S "$instrument" -B "$instrument/build-dsp" \
              -DCMAKE_BUILD_TYPE=Release \
              "-D${upper}_BUILD_PLUGIN=OFF" -DBUILD_TESTING=OFF
            cmake --build "$instrument/build-dsp" --parallel --target "$target"
          done

      - name: Render and commit the demo audio if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./vocalor/build-dsp/VocalorRenderDemos vocalor/Docs/audio
          ./drumalor/build-dsp/DrumalorRenderDemos drumalor/Docs/audio
          ./neuramar/build-dsp/NeuramarRenderDemos neuramar/Docs/audio
          ./electry/build-dsp/ElectryRenderDemos electry/Docs/audio
          ./taikor/build-dsp/TaikorRenderDemos taikor/Docs/audio
          ./youknow106/build-dsp/YouKnow106RenderDemos youknow106/Docs/audio
          # Stage before checking: a newly added demo is an untracked file,
          # which git diff alone would not see.
          git add -A vocalor/Docs/audio drumalor/Docs/audio \
            neuramar/Docs/audio electry/Docs/audio taikor/Docs/audio \
            youknow106/Docs/audio
          if git diff --cached --quiet; then
            echo "Demo audio is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nightly: re-render the committed demo audio"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs "$REMOTE" main
            # If render-relevant instrument code landed on main while this job
            # ran, these WAVs describe the older model; publishing them would
            # be wrong, and the next nightly will render the newer tree.
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- \
                vocalor drumalor neuramar electry taikor youknow106 \
                ':(exclude)vocalor/Docs' ':(exclude)drumalor/Docs' \
                ':(exclude)neuramar/Docs' ':(exclude)electry/Docs' \
                ':(exclude)taikor/Docs' ':(exclude)youknow106/Docs'; then
              echo "An instrument changed upstream during the render; deferring to the next nightly."
              exit 0
            fi
            if git push "$REMOTE" HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "error: could not push the re-rendered demo audio" >&2
          exit 1

  build-macos:
    if: github.ref == 'refs/heads/main'
    name: Universal builds, packages, and rolling release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build-time FetchContent code must not inherit the write credential.
          persist-credentials: false

      # Full arm64 + x86_64 universal builds (script default) plus project
      # tests. Each suite that supports it renders its committed editor
      # screenshot while it runs, so the images in the READMEs track the real
      # editors; the commit step below pushes any that changed.
      - name: Build Vocalor and run tests
        working-directory: vocalor
        env:
          VOCALOR_EDITOR_SNAPSHOT: ${{ github.workspace }}/vocalor/Docs/screenshots/vocalor-standalone.png
        run: ./scripts/build-macos.sh

      - name: Package Vocalor (ad-hoc-signed bundles)
        working-directory: vocalor
        run: ./scripts/sign-and-package-macos.sh

      - name: Build Drumalor and run tests
        working-directory: drumalor
        env:
          DRUMALOR_EDITOR_SNAPSHOT: ${{ github.workspace }}/drumalor/Docs/screenshots/drumalor-standalone.png
        run: ./scripts/build-macos.sh

      - name: Package Drumalor (ad-hoc-signed bundles)
        working-directory: drumalor
        run: ./scripts/sign-and-package-macos.sh

      - name: Build Neuramar and run tests
        working-directory: neuramar
        env:
          NEURAMAR_EDITOR_SNAPSHOT: ${{ github.workspace }}/neuramar/Docs/screenshots/neuramar-standalone.png
        run: ./scripts/build-macos.sh

      - name: Package Neuramar (ad-hoc-signed bundles)
        working-directory: neuramar
        run: ./scripts/sign-and-package-macos.sh

      - name: Build Electry and run tests
        working-directory: electry
        env:
          ELECTRY_EDITOR_SNAPSHOT: ${{ github.workspace }}/electry/Docs/screenshots/electry-standalone.png
        run: ./scripts/build-macos.sh

      - name: Package Electry (ad-hoc-signed bundles)
        working-directory: electry
        run: ./scripts/sign-and-package-macos.sh

      - name: Build Taikor and run tests
        working-directory: taikor
        env:
          TAIKOR_EDITOR_SNAPSHOT: ${{ github.workspace }}/taikor/Docs/screenshots/taikor-standalone.png
        run: ./scripts/build-macos.sh

      - name: Package Taikor (ad-hoc-signed bundles)
        working-directory: taikor
        run: ./scripts/sign-and-package-macos.sh

      - name: Build YouKnow106 and run tests
        working-directory: youknow106
        env:
          YOUKNOW106_EDITOR_SNAPSHOT: ${{ github.workspace }}/youknow106/Docs/screenshots/youknow106-standalone.png
        run: ./scripts/build-macos.sh

      - name: Package YouKnow106 (ad-hoc-signed bundles)
        working-directory: youknow106
        run: ./scripts/sign-and-package-macos.sh

      # Every suite renders its committed editor screenshot while it runs, so
      # the images in the READMEs track the real editors. The rebase-and-retry
      # loop absorbs the audio-demos job (or anything else) having pushed to
      # main while this job built.
      - name: Commit regenerated screenshots if they changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths=(
            vocalor/Docs/screenshots
            drumalor/Docs/screenshots
            neuramar/Docs/screenshots
            electry/Docs/screenshots
            taikor/Docs/screenshots
            youknow106/Docs/screenshots
          )
          # Stage before checking: a screenshot rendered for the first time is
          # an untracked file, which git diff alone would not see.
          git add -A "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nightly: regenerate the committed editor screenshots"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs "$REMOTE" main
            # If an instrument's code moved on main while this long build ran,
            # these PNGs were rendered from the older tree and replaying them
            # onto the newer one would publish stale editors. Skip: the next
            # nightly builds the newer tree and refreshes them correctly.
            # Docs-only churn (including the audio job's own commit) does not
            # invalidate a render, so it does not defer the push.
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- \
                vocalor drumalor neuramar electry taikor youknow106 \
                ':(exclude)vocalor/Docs' ':(exclude)drumalor/Docs' \
                ':(exclude)neuramar/Docs' ':(exclude)electry/Docs' \
                ':(exclude)taikor/Docs' ':(exclude)youknow106/Docs'; then
              echo "Instrument code changed upstream during the build; deferring the screenshot refresh to the next nightly."
              exit 0
            fi
            if git push "$REMOTE" HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "error: could not push the regenerated screenshots" >&2
          exit 1

      # Retained on the workflow run itself (downloadable by anyone with repo
      # access). Instrument-specific patterns prevent one output from
      # accidentally satisfying the other instrument's artifact check.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vst-instruments-nightly-macOS-universal
          path: |
            vocalor/build-macos/dist/Vocalor-*-macOS-universal.zip
            vocalor/build-macos/dist/Vocalor-*-macOS-universal.pkg
            drumalor/build-macos/dist/Drumalor-*-macOS-universal.zip
            drumalor/build-macos/dist/Drumalor-*-macOS-universal.pkg
            neuramar/build-macos/dist/Neuramar-*-macOS-universal.zip
            neuramar/build-macos/dist/Neuramar-*-macOS-universal.pkg
            electry/build-macos/dist/Electry-*-macOS-universal.zip
            electry/build-macos/dist/Electry-*-macOS-universal.pkg
            taikor/build-macos/dist/Taikor-*-macOS-universal.zip
            taikor/build-macos/dist/Taikor-*-macOS-universal.pkg
            youknow106/build-macos/dist/YouKnow106-*-macOS-universal.zip
            youknow106/build-macos/dist/YouKnow106-*-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 14

      # Publish a single rolling "nightly" release so all six instruments share a
      # stable public download URL.
      - name: Publish rolling "nightly" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          assets=(
            vocalor/build-macos/dist/Vocalor-*-macOS-universal.zip
            vocalor/build-macos/dist/Vocalor-*-macOS-universal.pkg
            drumalor/build-macos/dist/Drumalor-*-macOS-universal.zip
            drumalor/build-macos/dist/Drumalor-*-macOS-universal.pkg
            neuramar/build-macos/dist/Neuramar-*-macOS-universal.zip
            neuramar/build-macos/dist/Neuramar-*-macOS-universal.pkg
            electry/build-macos/dist/Electry-*-macOS-universal.zip
            electry/build-macos/dist/Electry-*-macOS-universal.pkg
            taikor/build-macos/dist/Taikor-*-macOS-universal.zip
            taikor/build-macos/dist/Taikor-*-macOS-universal.pkg
            youknow106/build-macos/dist/YouKnow106-*-macOS-universal.zip
            youknow106/build-macos/dist/YouKnow106-*-macOS-universal.pkg
          )
          if (( ${#assets[@]} != 12 )); then
            echo "error: expected exactly twelve release assets, found ${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "error: missing release asset: $asset" >&2
              exit 1
            fi
          done

          # Unique names let the previous complete release remain downloadable
          # throughout this upload. A rerun for the same commit may safely
          # replace only that commit's staged files.
          STAGING_DIR="${RUNNER_TEMP}/nightly-release-assets"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          staged_assets=()
          for asset in "${assets[@]}"; do
            filename="${asset##*/}"
            stem="${filename%.*}"
            extension="${filename##*.}"
            staged="${STAGING_DIR}/${stem}-g${SHORT_SHA}.${extension}"
            cp -p "$asset" "$staged"
            staged_assets+=("$staged")
          done
          expected_asset_names=()
          for asset in "${staged_assets[@]}"; do
            expected_asset_names+=("${asset##*/}")
          done

          TITLE="VST instruments nightly ($DATE)"
          NOTES="Automated universal (arm64 + x86_64) macOS builds of Vocalor, Drumalor, Neuramar, Electry, Taikor, and YouKnow106 from \`main\` ($SHORT_SHA).

          **These bundles are ad-hoc signed and not notarized**, so Gatekeeper will warn. To run a nightly locally, clear the quarantine flag after unzipping, e.g.:

          \`\`\`bash
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Vocalor.vst3 Library/Audio/Plug-Ins/Components/Vocalor.component Applications/Vocalor.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Drumalor.vst3 Library/Audio/Plug-Ins/Components/Drumalor.component Applications/Drumalor.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Neuramar.vst3 Library/Audio/Plug-Ins/Components/Neuramar.component Applications/Neuramar.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Electry.vst3 Library/Audio/Plug-Ins/Components/Electry.component Applications/Electry.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Taikor.vst3 Library/Audio/Plug-Ins/Components/Taikor.component Applications/Taikor.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/YouKnow106.vst3 Library/Audio/Plug-Ins/Components/YouKnow106.component Applications/YouKnow106.app
          \`\`\`

          Not intended for production distribution."

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${staged_assets[@]}" --clobber

            published_asset_names=()
            while IFS= read -r asset_name; do
              published_asset_names+=("$asset_name")
            done < <(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              --jq '.assets[] | select(.size > 0) | .name')
            for expected_name in "${expected_asset_names[@]}"; do
              found=0
              for published_name in "${published_asset_names[@]}"; do
                if [[ "$published_name" == "$expected_name" ]]; then
                  found=1
                  break
                fi
              done
              if (( found == 0 )); then
                echo "error: uploaded release asset was not verified: $expected_name" >&2
                exit 1
              fi
            done

            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit nightly --title "$TITLE" --prerelease --notes "$NOTES"

            # Prune only after upload verification and metadata/tag switching.
            # If pruning itself fails, both complete generations remain usable.
            while IFS=$'\t' read -r asset_id asset_name; do
              is_expected=0
              for expected_name in "${expected_asset_names[@]}"; do
                if [[ "$asset_name" == "$expected_name" ]]; then
                  is_expected=1
                  break
                fi
              done
              if (( is_expected == 0 )); then
                echo "Removing stale nightly asset: $asset_name"
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
              fi
            done < <(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              --jq '.assets[] | [.id, .name] | @tsv')
          else
            gh release create nightly "${staged_assets[@]}" \
              --title "$TITLE" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --notes "$NOTES"
          fi
