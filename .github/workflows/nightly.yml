name: Nightly

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: # allow manual runs from the Actions tab

# Refresh the rolling "nightly" release so the latest build is always available.
permissions:
  contents: write

# Never interrupt an in-progress publish; just don't run two at once.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # The committed demonstration WAVs of every instrument are rendered by their
  # JUCE-free renderers, so any model change shows up as changed bytes.
  # Re-rendering and committing them nightly keeps the audible record in
  # lockstep with the code; the nightly Linux toolchain is the canonical
  # renderer, and a run on an unchanged model commits nothing because every
  # render is deterministic.
  refresh-audio-demos:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Re-render the committed demo audio of every instrument
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build must not inherit the write credential; the push step
          # below supplies the token explicitly instead.
          persist-credentials: false

      # Every instrument is built and rendered independently, and a failure is
      # recorded rather than thrown: one broken renderer must not cost the
      # other five their refreshed audio. The job still fails at the end, so a
      # broken renderer is never silently tolerated.
      - name: Render every instrument's demo audio
        run: |
          set -uo pipefail

          # directory:renderer target:number of WAVs the renderer must produce.
          # The count is the point of the check: it is what turns "the renderer
          # ran" into "the renderer rendered the whole set", so a take that
          # silently stopped being written fails the nightly instead of leaving
          # a stale WAV committed forever. Adding or removing a take means
          # updating the number here in the same change.
          instruments=(
            "vocalor:VocalorRenderDemos:9"
            "drumalor:DrumalorRenderDemos:7"
            "neuramar:NeuramarRenderDemos:8"
            "electry:ElectryRenderDemos:14"
            "taikor:TaikorRenderDemos:25"
            "youknow106:YouKnow106RenderDemos:10"
          )

          # A failed instrument contributes nothing to the commit below. The
          # renderers write their takes one after another and return on the
          # first bad one, so a renderer that dies half way through leaves the
          # earlier takes freshly written and the rest as they were: a demo set
          # no single version of the engine ever produced, and worse to publish
          # than the untouched one. Restoring the tracked files and removing any
          # new ones puts the directory back exactly as it was checked out.
          discard() {
            git checkout -- "$1/Docs/audio" || true
            git clean -fdq "$1/Docs/audio" || true
          }

          failed=()
          for entry in "${instruments[@]}"; do
            IFS=: read -r directory target expected <<<"$entry"
            option="$(printf '%s' "$directory" | tr '[:lower:]' '[:upper:]')_BUILD_PLUGIN"

            echo "::group::$directory"
            if ! cmake -S "$directory" -B "$directory/build-dsp" \
                -DCMAKE_BUILD_TYPE=Release "-D${option}=OFF" -DBUILD_TESTING=OFF; then
              failed+=("$directory: could not configure the demo renderer")
              discard "$directory"
              echo "::endgroup::"
              continue
            fi
            if ! cmake --build "$directory/build-dsp" --parallel --target "$target"; then
              failed+=("$directory: could not build $target")
              discard "$directory"
              echo "::endgroup::"
              continue
            fi
            if ! "./$directory/build-dsp/$target" "$directory/Docs/audio"; then
              failed+=("$directory: $target exited non-zero, so its demo audio was left untouched")
              discard "$directory"
              echo "::endgroup::"
              continue
            fi

            rendered=$(find "$directory/Docs/audio" -maxdepth 1 -name '*.wav' | wc -l)
            if (( rendered != expected )); then
              failed+=("$directory: rendered $rendered demo WAVs, expected $expected")
              discard "$directory"
            else
              echo "$directory: rendered all $rendered demo WAVs"
            fi
            echo "::endgroup::"
          done

          # Truncate first: printf with an empty array would write a blank line,
          # which the reporting step below would read as a failure.
          : > "${RUNNER_TEMP}/failed-renderers.txt"
          if (( ${#failed[@]} > 0 )); then
            printf '%s\n' "${failed[@]}" > "${RUNNER_TEMP}/failed-renderers.txt"
            echo "Renderers that did not produce their full set:"
            printf '  %s\n' "${failed[@]}"
          fi

      # Committing runs even when a renderer failed above: the instruments that
      # did render deserve their refreshed audio, and the failure is reported by
      # the final step of this job.
      - name: Commit the demo audio if it changed
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Stage before checking: a newly added demo is an untracked file,
          # which git diff alone would not see.
          git add -A vocalor/Docs/audio drumalor/Docs/audio \
            neuramar/Docs/audio electry/Docs/audio taikor/Docs/audio \
            youknow106/Docs/audio
          if git diff --cached --quiet; then
            echo "Demo audio is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nightly: re-render the committed demo audio"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs "$REMOTE" main
            # If render-relevant instrument code landed on main while this job
            # ran, these WAVs describe the older model; publishing them would
            # be wrong, and the next nightly will render the newer tree.
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- \
                vocalor drumalor neuramar electry taikor youknow106 \
                ':(exclude)vocalor/Docs' ':(exclude)drumalor/Docs' \
                ':(exclude)neuramar/Docs' ':(exclude)electry/Docs' \
                ':(exclude)taikor/Docs' ':(exclude)youknow106/Docs'; then
              echo "An instrument changed upstream during the render; deferring to the next nightly."
              exit 0
            fi
            if git push "$REMOTE" HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "error: could not push the re-rendered demo audio" >&2
          exit 1

      - name: Fail if any instrument did not render its full set
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # A missing file means the render step died before it could report,
          # which is a failure rather than a clean sheet.
          if [[ ! -f "${RUNNER_TEMP}/failed-renderers.txt" ]]; then
            echo "error: the render step did not report its result" >&2
            exit 1
          fi
          if [[ -s "${RUNNER_TEMP}/failed-renderers.txt" ]]; then
            echo "error: the demo audio is incomplete:" >&2
            sed 's/^/  /' "${RUNNER_TEMP}/failed-renderers.txt" >&2
            exit 1
          fi
          echo "Every instrument rendered its full set of demo audio."

  # One job per instrument. Building all six in sequence meant a single flaky
  # test cost every instrument after it its screenshot, its package and the
  # release; now a failure is contained to its own instrument, and the six
  # builds run concurrently instead of end to end.
  build-macos:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Universal build and package (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vocalor
            directory: vocalor
            snapshot_variable: VOCALOR_EDITOR_SNAPSHOT
          - name: Drumalor
            directory: drumalor
            snapshot_variable: DRUMALOR_EDITOR_SNAPSHOT
          - name: Neuramar
            directory: neuramar
            snapshot_variable: NEURAMAR_EDITOR_SNAPSHOT
          - name: Electry
            directory: electry
            snapshot_variable: ELECTRY_EDITOR_SNAPSHOT
          - name: Taikor
            directory: taikor
            snapshot_variable: TAIKOR_EDITOR_SNAPSHOT
          - name: YouKnow106
            directory: youknow106
            snapshot_variable: YOUKNOW106_EDITOR_SNAPSHOT
    steps:
      - uses: actions/checkout@v4
        with:
          # Build-time FetchContent code must not inherit the write credential.
          persist-credentials: false

      # Removing the committed image first is what makes the check after the
      # build meaningful: the file can only be there afterwards because this
      # run's suite rendered it, so a suite that quietly stopped writing its
      # snapshot fails the nightly instead of republishing a stale editor.
      - name: Clear the committed screenshot before rendering
        run: rm -f "${{ matrix.directory }}/Docs/screenshots/${{ matrix.directory }}-standalone.png"

      # Full arm64 + x86_64 universal build (script default) plus the project's
      # tests. The suite renders the committed editor screenshot while it runs,
      # so the images in the READMEs track the real editors.
      - name: Build ${{ matrix.name }} and run tests
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          export "${{ matrix.snapshot_variable }}=${GITHUB_WORKSPACE}/${{ matrix.directory }}/Docs/screenshots/${{ matrix.directory }}-standalone.png"
          ./scripts/build-macos.sh

      - name: Check that the editor screenshot was rendered
        run: |
          set -euo pipefail
          screenshot="${{ matrix.directory }}/Docs/screenshots/${{ matrix.directory }}-standalone.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "error: ${{ matrix.name }}'s suite did not render $screenshot" >&2
            echo "The suite must honour ${{ matrix.snapshot_variable }}." >&2
            exit 1
          fi
          if [[ "$(head -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
            echo "error: $screenshot does not carry the PNG signature" >&2
            exit 1
          fi
          # The signature alone only proves the write started: a PNG truncated
          # part way through still carries it. Every PNG ends with a
          # zero-length IEND chunk and its constant CRC, so the trailer is what
          # proves the encoder ran to completion and a whole image landed.
          if [[ "$(tail -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "49454e44ae426082" ]]; then
            echo "error: $screenshot has no terminating IEND chunk, so the write did not finish" >&2
            exit 1
          fi
          echo "Rendered $screenshot ($(wc -c < "$screenshot") bytes)."

      # Handed to the commit job rather than committed here, so that all six
      # land in one commit. It is uploaded before packaging so that a packaging
      # failure cannot cost an instrument the screenshot it has already
      # rendered: the two are independent, and the commit job preserves
      # whatever was produced.
      #
      # It stays gated on the suite passing, though, and deliberately so. The
      # processor suites count their failures rather than stopping at the first
      # one, so a run whose editor assertions failed -- a blank render, buttons
      # that overlap, a control strip that lost its buttons -- still writes the
      # PNG before reporting the failure. Publishing that image is the one
      # outcome worse than leaving yesterday's in place, and the committed
      # screenshot is only worth what its passing suite says about it. An
      # instrument whose suite failed keeps its previous image for a night.
      - name: Upload the rendered screenshot
        uses: actions/upload-artifact@v4
        with:
          name: nightly-screenshot-${{ matrix.directory }}
          path: ${{ matrix.directory }}/Docs/screenshots/${{ matrix.directory }}-standalone.png
          if-no-files-found: error
          retention-days: 1

      - name: Package ${{ matrix.name }} (ad-hoc-signed bundles)
        working-directory: ${{ matrix.directory }}
        run: ./scripts/sign-and-package-macos.sh

      - name: Check that both distributable packages were produced
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(
            ${{ matrix.directory }}/build-macos/dist/${{ matrix.name }}-*-macOS-universal.zip
            ${{ matrix.directory }}/build-macos/dist/${{ matrix.name }}-*-macOS-universal.pkg
          )
          if (( ${#packages[@]} != 2 )); then
            echo "error: expected one zip and one pkg for ${{ matrix.name }}, found ${#packages[@]}" >&2
            printf '  %s\n' "${packages[@]:-(none)}" >&2
            exit 1
          fi
          printf 'Packaged %s\n' "${packages[@]}"

      # Handed to the release job rather than published here, so the rolling
      # release is switched once, as one complete twelve-asset set.
      - name: Upload the distributable packages
        uses: actions/upload-artifact@v4
        with:
          name: nightly-packages-${{ matrix.directory }}
          path: |
            ${{ matrix.directory }}/build-macos/dist/${{ matrix.name }}-*-macOS-universal.zip
            ${{ matrix.directory }}/build-macos/dist/${{ matrix.name }}-*-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 1

  # Every suite renders its committed editor screenshot while it runs, so the
  # images in the READMEs track the real editors. This runs even when an
  # instrument failed to build: the screenshots that were rendered are still
  # worth committing, and the missing ones are reported at the end.
  commit-screenshots:
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    name: Commit the regenerated editor screenshots
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The push step below supplies the write credential explicitly.
          persist-credentials: false

      # Nothing to download if every instrument failed, which is a reportable
      # state rather than an error in this step.
      - name: Download the rendered screenshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: nightly-screenshot-*
          merge-multiple: true
          path: rendered-screenshots

      - name: Place the rendered screenshots in the tree
        run: |
          set -euo pipefail
          missing=()
          for directory in vocalor drumalor neuramar electry taikor youknow106; do
            rendered="rendered-screenshots/${directory}-standalone.png"
            if [[ -s "$rendered" ]]; then
              mkdir -p "${directory}/Docs/screenshots"
              cp "$rendered" "${directory}/Docs/screenshots/${directory}-standalone.png"
              echo "$directory: took the freshly rendered screenshot"
            else
              missing+=("$directory")
              echo "$directory: no screenshot was accepted from this run"
            fi
          done
          # Truncate first: printf with an empty array would write a blank line,
          # which the reporting step below would read as a missing screenshot.
          : > "${RUNNER_TEMP}/missing-screenshots.txt"
          if (( ${#missing[@]} > 0 )); then
            printf '%s\n' "${missing[@]}" > "${RUNNER_TEMP}/missing-screenshots.txt"
          fi

      - name: Commit the screenshots if they changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Stage before checking: a screenshot rendered for the first time is
          # an untracked file, which git diff alone would not see. A directory
          # that does not exist is skipped rather than aborting the add, so a
          # brand-new instrument whose build failed cannot cost the others
          # their commit.
          paths=()
          for directory in vocalor drumalor neuramar electry taikor youknow106; do
            if [[ -d "${directory}/Docs/screenshots" ]]; then
              paths+=("${directory}/Docs/screenshots")
            fi
          done
          if (( ${#paths[@]} == 0 )); then
            echo "No screenshot directories exist; nothing to commit."
            exit 0
          fi
          git add -A "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nightly: regenerate the committed editor screenshots"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs "$REMOTE" main
            # If an instrument's code moved on main while this build ran, these
            # PNGs were rendered from the older tree and replaying them onto the
            # newer one would publish stale editors. Skip: the next nightly
            # builds the newer tree and refreshes them correctly. Docs-only
            # churn (including the audio job's own commit) does not invalidate a
            # render, so it does not defer the push.
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- \
                vocalor drumalor neuramar electry taikor youknow106 \
                ':(exclude)vocalor/Docs' ':(exclude)drumalor/Docs' \
                ':(exclude)neuramar/Docs' ':(exclude)electry/Docs' \
                ':(exclude)taikor/Docs' ':(exclude)youknow106/Docs'; then
              echo "Instrument code changed upstream during the build; deferring the screenshot refresh to the next nightly."
              exit 0
            fi
            if git push "$REMOTE" HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "error: could not push the regenerated screenshots" >&2
          exit 1

      - name: Fail if any instrument did not render its screenshot
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # A missing file means the step that placed the screenshots died
          # before it could report, which is a failure rather than a clean sheet.
          if [[ ! -f "${RUNNER_TEMP}/missing-screenshots.txt" ]]; then
            echo "error: the screenshot placement step did not report its result" >&2
            exit 1
          fi
          if [[ -s "${RUNNER_TEMP}/missing-screenshots.txt" ]]; then
            echo "error: no screenshot was accepted from:" >&2
            sed 's/^/  /' "${RUNNER_TEMP}/missing-screenshots.txt" >&2
            echo "Each of those either failed to build, failed its suite, or" >&2
            echo "did not render a complete PNG; see that instrument's build" >&2
            echo "job. Their previously committed screenshots are unchanged." >&2
            exit 1
          fi
          echo "Every instrument rendered its editor screenshot."

  # Publish a single rolling "nightly" release so all six instruments share a
  # stable public download URL. It needs every instrument, so it runs only when
  # all six built: a release is a complete set or it is not published at all.
  publish-release:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Publish the rolling nightly release
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download every instrument's packages
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-packages-*
          merge-multiple: true
          path: dist

      - name: Check the twelve-file manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          for product in Vocalor Drumalor Neuramar Electry Taikor YouKnow106; do
            for extension in zip pkg; do
              matches=(dist/${product}-*-macOS-universal.${extension})
              if (( ${#matches[@]} != 1 )); then
                echo "error: expected exactly one ${product} ${extension}, found ${#matches[@]}" >&2
                printf '  %s\n' "${matches[@]:-(none)}" >&2
                exit 1
              fi
            done
          done
          assets=(dist/*)
          if (( ${#assets[@]} != 12 )); then
            echo "error: expected exactly twelve release assets, found ${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]:-(none)}" >&2
            exit 1
          fi
          printf 'Release asset: %s\n' "${assets[@]}"

      # Retained on the workflow run itself (downloadable by anyone with repo
      # access), as one complete set rather than six per-instrument artifacts.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vst-instruments-nightly-macOS-universal
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling "nightly" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          assets=(dist/*)

          # Unique names let the previous complete release remain downloadable
          # throughout this upload. A rerun for the same commit may safely
          # replace only that commit's staged files.
          STAGING_DIR="${RUNNER_TEMP}/nightly-release-assets"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          staged_assets=()
          for asset in "${assets[@]}"; do
            filename="${asset##*/}"
            stem="${filename%.*}"
            extension="${filename##*.}"
            staged="${STAGING_DIR}/${stem}-g${SHORT_SHA}.${extension}"
            cp -p "$asset" "$staged"
            staged_assets+=("$staged")
          done
          expected_asset_names=()
          for asset in "${staged_assets[@]}"; do
            expected_asset_names+=("${asset##*/}")
          done

          TITLE="VST instruments nightly ($DATE)"
          NOTES="Automated universal (arm64 + x86_64) macOS builds of Vocalor, Drumalor, Neuramar, Electry, Taikor, and YouKnow106 from \`main\` ($SHORT_SHA).

          **These bundles are ad-hoc signed and not notarized**, so Gatekeeper will warn. To run a nightly locally, clear the quarantine flag after unzipping, e.g.:

          \`\`\`bash
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Vocalor.vst3 Library/Audio/Plug-Ins/Components/Vocalor.component Applications/Vocalor.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Drumalor.vst3 Library/Audio/Plug-Ins/Components/Drumalor.component Applications/Drumalor.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Neuramar.vst3 Library/Audio/Plug-Ins/Components/Neuramar.component Applications/Neuramar.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Electry.vst3 Library/Audio/Plug-Ins/Components/Electry.component Applications/Electry.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/Taikor.vst3 Library/Audio/Plug-Ins/Components/Taikor.component Applications/Taikor.app
          xattr -dr com.apple.quarantine Library/Audio/Plug-Ins/VST3/YouKnow106.vst3 Library/Audio/Plug-Ins/Components/YouKnow106.component Applications/YouKnow106.app
          \`\`\`

          Not intended for production distribution."

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${staged_assets[@]}" --clobber

            published_asset_names=()
            while IFS= read -r asset_name; do
              published_asset_names+=("$asset_name")
            done < <(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              --jq '.assets[] | select(.size > 0) | .name')
            for expected_name in "${expected_asset_names[@]}"; do
              found=0
              for published_name in "${published_asset_names[@]}"; do
                if [[ "$published_name" == "$expected_name" ]]; then
                  found=1
                  break
                fi
              done
              if (( found == 0 )); then
                echo "error: uploaded release asset was not verified: $expected_name" >&2
                exit 1
              fi
            done

            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit nightly --title "$TITLE" --prerelease --notes "$NOTES"

            # Prune only after upload verification and metadata/tag switching.
            # If pruning itself fails, both complete generations remain usable.
            while IFS=$'\t' read -r asset_id asset_name; do
              is_expected=0
              for expected_name in "${expected_asset_names[@]}"; do
                if [[ "$asset_name" == "$expected_name" ]]; then
                  is_expected=1
                  break
                fi
              done
              if (( is_expected == 0 )); then
                echo "Removing stale nightly asset: $asset_name"
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
              fi
            done < <(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              --jq '.assets[] | [.id, .name] | @tsv')
          else
            gh release create nightly "${staged_assets[@]}" \
              --title "$TITLE" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --notes "$NOTES"
          fi
