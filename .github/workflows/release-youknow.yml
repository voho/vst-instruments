name: Release YouKnow

on:
  push:
    tags:
      - "youknow-v*"

permissions:
  contents: read

concurrency:
  group: release-youknow
  cancel-in-progress: false

jobs:
  macos:
    name: Sign, notarize and publish macOS
    runs-on: macos-15
    environment: youknow-production
    permissions:
      contents: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the protected release source and repository settings
        env:
          RELEASE_SETTINGS_TOKEN: ${{ secrets.YOUKNOW_RELEASE_SETTINGS_TOKEN }}
        run: |
          set -euo pipefail
          : "${RELEASE_SETTINGS_TOKEN:?configure YOUKNOW_RELEASE_SETTINGS_TOKEN in the protected environment}"

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: the release tag must point to a commit on main" >&2
            exit 1
          fi

          api_version="2026-03-10"
          immutable="$(GH_TOKEN="${RELEASE_SETTINGS_TOKEN}" gh api \
            -H "X-GitHub-Api-Version: ${api_version}" \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq '.enabled')"
          if [[ "${immutable}" != "true" ]]; then
            echo "error: GitHub release immutability is not enabled" >&2
            exit 1
          fi

          tag_locks=0
          while IFS= read -r ruleset_id; do
            [[ -n "${ruleset_id}" ]] || continue
            ruleset="$(GH_TOKEN="${RELEASE_SETTINGS_TOKEN}" gh api \
              -H "X-GitHub-Api-Version: ${api_version}" \
              "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}")"
            if ! jq -e '.bypass_actors | type == "array"' \
                <<< "${ruleset}" >/dev/null; then
              echo "error: release token cannot inspect tag-ruleset bypass actors" >&2
              echo "Grant repository Administration read/write, then retry." >&2
              exit 1
            fi
            if jq -e '
              .target == "tag" and .enforcement == "active" and
              (.bypass_actors | length == 0) and
              ((.conditions.ref_name.include // []) |
                index("refs/tags/youknow-v*") != null) and
              ((.conditions.ref_name.exclude // []) | length == 0) and
              ([.rules[]?.type] | index("update") != null) and
              ([.rules[]?.type] | index("deletion") != null)
            ' <<< "${ruleset}" >/dev/null; then
              ((tag_locks += 1))
            fi
          done < <(GH_TOKEN="${RELEASE_SETTINGS_TOKEN}" gh api \
            -H "X-GitHub-Api-Version: ${api_version}" \
            "repos/${GITHUB_REPOSITORY}/rulesets?targets=tag" \
            --jq '.[] | select(.target == "tag" and .enforcement == "active") | .id')
          if (( tag_locks < 1 )); then
            echo "error: an active no-bypass ruleset must prevent release-tag updates and deletions" >&2
            exit 1
          fi

          environment="$(GH_TOKEN="${RELEASE_SETTINGS_TOKEN}" gh api \
            -H "X-GitHub-Api-Version: ${api_version}" \
            "repos/${GITHUB_REPOSITORY}/environments/youknow-production")"
          reviewers="$(printf '%s' "${environment}" | jq \
            '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length')"
          custom_tags="$(printf '%s' "${environment}" | jq -r \
            '.deployment_branch_policy.custom_branch_policies')"
          if (( reviewers < 1 )) || [[ "${custom_tags}" != "true" ]]; then
            echo "error: youknow-production must require a reviewer and custom tag policy" >&2
            exit 1
          fi

          deployment_policies="$(GH_TOKEN="${RELEASE_SETTINGS_TOKEN}" gh api \
            -H "X-GitHub-Api-Version: ${api_version}" \
            "repos/${GITHUB_REPOSITORY}/environments/youknow-production/deployment-branch-policies")"
          tag_policies="$(jq \
            '[.branch_policies[] | select(.name == "youknow-v*" and .type == "tag")] | length' \
            <<< "${deployment_policies}")"
          policy_count="$(jq '.total_count' <<< "${deployment_policies}")"
          if (( tag_policies != 1 || policy_count != 1 )); then
            echo "error: the release environment must allow only one youknow-v* tag policy" >&2
            exit 1
          fi

      - name: Import Apple signing and notarization credentials
        env:
          APP_CERTIFICATE: ${{ secrets.YOUKNOW_APP_CERTIFICATE_P12_BASE64 }}
          APP_CERTIFICATE_PASSWORD: ${{ secrets.YOUKNOW_APP_CERTIFICATE_P12_PASSWORD }}
          INSTALLER_CERTIFICATE: ${{ secrets.YOUKNOW_INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.YOUKNOW_INSTALLER_CERTIFICATE_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.YOUKNOW_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.YOUKNOW_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.YOUKNOW_NOTARY_ISSUER_ID }}
          APP_SIGN_IDENTITY: ${{ vars.YOUKNOW_APP_SIGN_IDENTITY }}
          INSTALLER_SIGN_IDENTITY: ${{ vars.YOUKNOW_INSTALLER_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          : "${APP_CERTIFICATE:?missing application certificate}"
          : "${APP_CERTIFICATE_PASSWORD:?missing application certificate password}"
          : "${INSTALLER_CERTIFICATE:?missing installer certificate}"
          : "${INSTALLER_CERTIFICATE_PASSWORD:?missing installer certificate password}"
          : "${NOTARY_KEY:?missing App Store Connect API key}"
          : "${NOTARY_KEY_ID:?missing App Store Connect API key ID}"
          : "${NOTARY_ISSUER_ID:?missing App Store Connect API issuer ID}"
          : "${APP_SIGN_IDENTITY:?missing YOUKNOW_APP_SIGN_IDENTITY environment variable}"
          : "${INSTALLER_SIGN_IDENTITY:?missing YOUKNOW_INSTALLER_SIGN_IDENTITY environment variable}"

          app_certificate="${RUNNER_TEMP}/youknow-app.p12"
          installer_certificate="${RUNNER_TEMP}/youknow-installer.p12"
          notary_key="${RUNNER_TEMP}/youknow-notary.p8"
          keychain="${RUNNER_TEMP}/youknow-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"

          printf '%s' "${APP_CERTIFICATE}" | base64 --decode -o "${app_certificate}"
          printf '%s' "${INSTALLER_CERTIFICATE}" | base64 --decode -o "${installer_certificate}"
          printf '%s' "${NOTARY_KEY}" | base64 --decode -o "${notary_key}"
          chmod 600 "${app_certificate}" "${installer_certificate}" "${notary_key}"

          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${app_certificate}" -P "${APP_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -k "${keychain}"
          security import "${installer_certificate}" -P "${INSTALLER_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/productsign -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "${keychain_password}" "${keychain}"
          security list-keychains -d user -s "${keychain}"

          security find-identity -v "${keychain}" | grep -F -- "\"${APP_SIGN_IDENTITY}\"" >/dev/null
          security find-identity -v "${keychain}" | grep -F -- "\"${INSTALLER_SIGN_IDENTITY}\"" >/dev/null
          xcrun notarytool store-credentials youknow-ci-notary \
            --key "${notary_key}" --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" --validate

          rm -f "${app_certificate}" "${installer_certificate}" "${notary_key}"

      - name: Build, test, sign, notarize and package
        working-directory: youknow
        env:
          APP_SIGN_IDENTITY: ${{ vars.YOUKNOW_APP_SIGN_IDENTITY }}
          INSTALLER_SIGN_IDENTITY: ${{ vars.YOUKNOW_INSTALLER_SIGN_IDENTITY }}
          NOTARY_PROFILE: youknow-ci-notary
        run: ./scripts/release-macos.sh

      - name: Verify the publication set
        run: |
          set -euo pipefail
          shopt -s nullglob
          dist="youknow/build-macos/dist"
          version="${GITHUB_REF_NAME#youknow-v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: invalid release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          package="${dist}/YouKnow-${version}-macOS-universal.pkg"
          manifest="${dist}/YouKnow-${version}-macOS-universal.manifest.txt"
          checksum="${dist}/YouKnow-${version}-macOS-universal-SHA256SUMS.txt"
          artifacts=("${dist}"/*)
          if (( ${#artifacts[@]} != 3 )); then
            echo "error: expected exactly three publication artifacts" >&2
            printf '  %s\n' "${artifacts[@]:-(none)}" >&2
            exit 1
          fi
          for artifact in "${package}" "${manifest}" "${checksum}"; do
            if [[ ! -s "${artifact}" ]]; then
              echo "error: missing or empty release artifact: ${artifact}" >&2
              exit 1
            fi
          done

          head_commit="$(git rev-parse HEAD)"
          package_hash="$(shasum -a 256 "${package}" | awk '{print $1}')"
          manifest_hash="$(shasum -a 256 "${manifest}" | awk '{print $1}')"
          customer_licence_hash="$(shasum -a 256 youknow/EULA.md | awk '{print $1}')"
          juce_licence_hash="$(shasum -a 256 youknow/ThirdParty/JUCE-LICENSE.md | awk '{print $1}')"
          cmake_version="$(cmake --version | sed -n '1p')"
          xcode_version="$(xcodebuild -version | paste -sd ' ' -)"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          cxx_compiler="$(sed -n 's/^CMAKE_CXX_COMPILER:[^=]*=//p' \
            youknow/build-macos/CMakeCache.txt)"
          if [[ -z "${cxx_compiler}" || ! -x "${cxx_compiler}" ]]; then
            cxx_compiler="$(xcrun --find clang++ 2>/dev/null || true)"
          fi
          if [[ -z "${cxx_compiler}" || ! -x "${cxx_compiler}" ]]; then
            echo "error: no executable C++ compiler in CMake cache or xcrun" >&2
            exit 1
          fi
          cxx_version="$("${cxx_compiler}" --version | sed -n '1p')"

          duplicate_keys="$(sed -n 's/^\([^:]*\):.*/\1/p' "${manifest}" \
            | sort | uniq -d)"
          if [[ -n "${duplicate_keys}" ]]; then
            echo "error: manifest contains duplicate keys:" >&2
            printf '  %s\n' "${duplicate_keys}" >&2
            exit 1
          fi

          grep -Fx -- "Product: YouKnow" "${manifest}" >/dev/null
          grep -Fx -- "Vendor: Protocodus" "${manifest}" >/dev/null
          grep -Fx -- "Website: https://protocodus.cz" "${manifest}" >/dev/null
          grep -Fx -- "Support: protocodus@proton.me" "${manifest}" >/dev/null
          grep -Fx -- "Version: ${version}" "${manifest}" >/dev/null
          grep -Ex -- '^Architectures: (arm64 x86_64|x86_64 arm64)$' \
            "${manifest}" >/dev/null
          grep -Fx -- "Minimum macOS: 11.0" "${manifest}" >/dev/null
          grep -Fx -- "CMake: ${cmake_version}" "${manifest}" >/dev/null
          grep -Fx -- "Xcode: ${xcode_version}" "${manifest}" >/dev/null
          grep -Fx -- "macOS SDK: ${sdk_version}" "${manifest}" >/dev/null
          grep -Fx -- "C++ compiler: ${cxx_version}" "${manifest}" >/dev/null
          grep -Fx -- "Package: $(basename "${package}")" "${manifest}" >/dev/null
          grep -Fx -- "Package SHA-256: ${package_hash}" "${manifest}" >/dev/null
          grep -Fx -- "Release mode: 1" "${manifest}" >/dev/null
          grep -Fx -- "Notarization status: Accepted" "${manifest}" >/dev/null
          grep -E -- '^Notarization submission: [0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$' \
            "${manifest}" >/dev/null
          grep -Fx -- "Source commit: ${head_commit}" "${manifest}" >/dev/null
          grep -Fx -- "Source tree: clean" "${manifest}" >/dev/null
          grep -Fx -- "Customer licence SHA-256: ${customer_licence_hash}" \
            "${manifest}" >/dev/null
          grep -Fx -- "JUCE LICENSE.md SHA-256: ${juce_licence_hash}" \
            "${manifest}" >/dev/null
          grep -Fx -- "Standalone bundle identifier: cz.protocodus.youknow" \
            "${manifest}" >/dev/null
          grep -Fx -- "Audio Unit bundle identifier: cz.protocodus.youknow.au" \
            "${manifest}" >/dev/null
          grep -Fx -- "VST3 bundle identifier: cz.protocodus.youknow.vst3" \
            "${manifest}" >/dev/null
          grep -Fx -- "Package identifier: cz.protocodus.youknow.pkg" \
            "${manifest}" >/dev/null
          grep -Fx -- "Audio Unit identity: aumu/Yk06/Ykno" \
            "${manifest}" >/dev/null
          grep -Fx -- "VST3 processor CID: ABCDEF019182FAEB596B6E6F596B3036" \
            "${manifest}" >/dev/null
          grep -Fx -- "VST3 controller CID: ABCDEF011234ABCD596B6E6F596B3036" \
            "${manifest}" >/dev/null
          grep -Fx -- "${package_hash}  $(basename "${package}")" \
            "${checksum}" >/dev/null
          grep -Fx -- "${manifest_hash}  $(basename "${manifest}")" \
            "${checksum}" >/dev/null
          checksum_lines="$(wc -l < "${checksum}" | tr -d '[:space:]')"
          if (( checksum_lines != 2 )); then
            echo "error: checksum file must cover exactly the PKG and manifest" >&2
            exit 1
          fi
          (cd "${dist}" && shasum -a 256 -c "$(basename "${checksum}")")

      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          head_commit="$(git rev-parse HEAD)"
          remote_tag="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          remote_type="$(jq -r '.object.type' <<< "${remote_tag}")"
          remote_sha="$(jq -r '.object.sha' <<< "${remote_tag}")"
          while [[ "${remote_type}" == "tag" ]]; do
            remote_tag="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${remote_sha}")"
            remote_type="$(jq -r '.object.type' <<< "${remote_tag}")"
            remote_sha="$(jq -r '.object.sha' <<< "${remote_tag}")"
          done
          if [[ "${remote_type}" != "commit" || "${remote_sha}" != "${head_commit}" ]]; then
            echo "error: remote release tag no longer resolves to checked-out HEAD" >&2
            exit 1
          fi

          assets=(
            youknow/build-macos/dist/YouKnow-*-macOS-universal.pkg
            youknow/build-macos/dist/YouKnow-*-macOS-universal.manifest.txt
            youknow/build-macos/dist/YouKnow-*-macOS-universal-SHA256SUMS.txt
          )
          version="${GITHUB_REF_NAME#youknow-v}"
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag --title "YouKnow ${version}" \
            --notes "Signed, notarized and stapled commercial macOS release."

          immutable="$(gh release view "${GITHUB_REF_NAME}" \
            --json isImmutable --jq '.isImmutable')"
          if [[ "${immutable}" != "true" ]]; then
            echo "error: GitHub did not make the published release immutable" >&2
            exit 1
          fi

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/youknow-app.p12" \
            "${RUNNER_TEMP}/youknow-installer.p12" \
            "${RUNNER_TEMP}/youknow-notary.p8"
          security delete-keychain \
            "${RUNNER_TEMP}/youknow-signing.keychain-db" 2>/dev/null || true
