name: Update Electry screenshot

# The committed editor screenshot is produced by the plug-in regression suite
# itself (ELECTRY_EDITOR_SNAPSHOT), so it is always a real editor render. This
# workflow exists because that render needs macOS and Xcode: dispatch it on a
# branch after an editor change and it rebuilds Electry, re-renders the PNG
# through the suite, and commits the result back to that branch if it changed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-electry-screenshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-and-commit:
    name: Render the editor through the test suite and commit the PNG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build-time FetchContent code must not inherit the write
          # credential (the same stance the Nightly workflow takes); the
          # push step below supplies the token explicitly instead.
          persist-credentials: false

      # Native-arch is enough: the snapshot does not depend on the second
      # architecture slice, and this keeps the run close to per-push CI.
      - name: Build Electry and render the editor snapshot
        working-directory: electry
        env:
          BUILD_UNIVERSAL: "OFF"
          ELECTRY_EDITOR_SNAPSHOT: ${{ github.workspace }}/electry/Docs/screenshots/electry-standalone.png
        run: ./scripts/build-macos.sh

      - name: Commit the screenshot if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- electry/Docs/screenshots; then
            echo "Screenshot is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electry/Docs/screenshots
          git commit -m "Regenerate the Electry editor screenshot from the test suite"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
